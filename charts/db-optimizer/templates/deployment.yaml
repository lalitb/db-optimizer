apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "db-optimizer.fullname" . }}
  labels:
    {{- include "db-optimizer.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "db-optimizer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "db-optimizer.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "db-optimizer.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          {{- if .Values.privileged.enabled }}
          securityContext:
            privileged: true
            capabilities:
              add:
                {{- toYaml .Values.privileged.capabilities | nindent 16 }}
          {{- else }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          image: {{ include "db-optimizer.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--config"
            - "/etc/db-optimizer/config.yml"
          ports:
            {{- if .Values.config.httpApi.enabled }}
            - name: http
              containerPort: {{ .Values.config.httpApi.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.config.prometheus.enabled }}
            - name: metrics
              containerPort: {{ .Values.config.prometheus.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: RUST_LOG
              value: {{ .Values.config.log.level }}
            {{- if .Values.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- else if .Values.database.connectionString }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "db-optimizer.fullname" . }}-db
                  key: database-url
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "db-optimizer.fullname" . }}-db
                  key: database-url
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/db-optimizer
              readOnly: true
            {{- if .Values.config.ebpf.enabled }}
            - name: ebpf-socket
              mountPath: /var/run/db-optimizer
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "db-optimizer.fullname" . }}-config
        {{- if .Values.config.ebpf.enabled }}
        - name: ebpf-socket
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
