apiVersion: v1
kind: Service
metadata:
  name: {{ include "db-optimizer.fullname" . }}
  labels:
    {{- include "db-optimizer.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if .Values.config.httpApi.enabled }}
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- end }}
    {{- if .Values.config.prometheus.enabled }}
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "db-optimizer.selectorLabels" . | nindent 4 }}
