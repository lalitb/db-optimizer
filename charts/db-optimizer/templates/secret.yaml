{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "db-optimizer.fullname" . }}-db
  labels:
    {{- include "db-optimizer.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ include "db-optimizer.databaseUrl" . | quote }}
{{- end }}
