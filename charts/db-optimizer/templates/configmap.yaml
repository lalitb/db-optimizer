apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "db-optimizer.fullname" . }}-config
  labels:
    {{- include "db-optimizer.labels" . | nindent 4 }}
data:
  config.yml: |
    # db-optimizer configuration
    # Generated by Helm chart
    
    # Analysis settings
    analysis:
      interval_seconds: {{ .Values.config.analysisInterval }}
    
    # Auto-apply settings
    auto_apply:
      enabled: {{ .Values.config.autoApply.enabled }}
      dry_run: {{ .Values.config.autoApply.dryRun }}
      max_risk_level: {{ .Values.config.autoApply.maxRiskLevel | quote }}
      min_savings_threshold: {{ .Values.config.autoApply.minSavingsThreshold }}
    
    # eBPF settings
    ebpf:
      enabled: {{ .Values.config.ebpf.enabled }}
      socket_path: {{ .Values.config.ebpf.socketPath | quote }}
    
    # Prometheus metrics
    prometheus:
      enabled: {{ .Values.config.prometheus.enabled }}
      port: {{ .Values.config.prometheus.port }}
      path: {{ .Values.config.prometheus.path | quote }}
    
    # HTTP API
    http:
      enabled: {{ .Values.config.httpApi.enabled }}
      port: {{ .Values.config.httpApi.port }}
    
    # Logging
    log:
      level: {{ .Values.config.log.level | quote }}
      format: {{ .Values.config.log.format | quote }}
    
    {{- if .Values.cnpg.enabled }}
    # CloudNativePG integration
    cnpg:
      enabled: true
      cluster_name: {{ .Values.cnpg.clusterName | quote }}
      cluster_namespace: {{ .Values.cnpg.clusterNamespace | quote }}
    {{- end }}
