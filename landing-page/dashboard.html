<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaanyze Fleet Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .metric-value { transition: color 0.3s ease; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- Navigation -->
    <nav class="bg-white border-b border-gray-200 fixed w-full z-30 top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <span class="text-xl font-bold text-purple-600">Vaanyze Fleet</span>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="#" class="border-purple-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Dashboard
                        </a>
                        <a href="#" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Settings
                        </a>
                    </div>
                </div>
                <div class="flex items-center">
                    <div class="flex items-center gap-2">
                        <div class="h-2 w-2 rounded-full bg-green-500 animate-pulse"></div>
                        <span class="text-sm text-gray-500">Live Updates</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-20 pb-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
        
        <!-- Fleet Summary -->
        <div class="mb-8 grid grid-cols-1 gap-5 sm:grid-cols-4">
            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="px-4 py-5 sm:p-6">
                    <dt class="text-sm font-medium text-gray-500 truncate">Total Instances</dt>
                    <dd class="mt-1 text-3xl font-semibold text-gray-900" id="summary-total">-</dd>
                </div>
            </div>
            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="px-4 py-5 sm:p-6">
                    <dt class="text-sm font-medium text-gray-500 truncate">Healthy</dt>
                    <dd class="mt-1 text-3xl font-semibold text-green-600" id="summary-healthy">-</dd>
                </div>
            </div>
            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="px-4 py-5 sm:p-6">
                    <dt class="text-sm font-medium text-gray-500 truncate">Critical Issues</dt>
                    <dd class="mt-1 text-3xl font-semibold text-red-600" id="summary-critical">-</dd>
                </div>
            </div>
            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="px-4 py-5 sm:p-6">
                    <dt class="text-sm font-medium text-gray-500 truncate">Avg Health Score</dt>
                    <dd class="mt-1 text-3xl font-semibold text-purple-600" id="summary-score">-</dd>
                </div>
            </div>
        </div>

        <!-- Instance Grid -->
        <div class="grid grid-cols-1 gap-6 lg:grid-cols-2" id="instance-grid">
            <!-- Instances will be injected here -->
        </div>

    </main>

    <script>
        const API_BASE = '/api/v1'; // Relative path to work on any port

        // State to track existing instances and avoid full re-renders
        const instanceState = new Set();

        async function fetchFleetData() {
            try {
                // Fetch Summary
                const summaryRes = await fetch(`${API_BASE}/fleet/summary`);
                const summary = await summaryRes.json();
                updateSummary(summary);

                // Fetch Instances
                const instancesRes = await fetch(`${API_BASE}/fleet`);
                const instances = await instancesRes.json();
                updateInstances(instances);

            } catch (error) {
                console.error('Error fetching fleet data:', error);
            }
        }

        function updateSummary(summary) {
            document.getElementById('summary-total').textContent = summary.total_databases;
            document.getElementById('summary-healthy').textContent = summary.healthy_count;
            document.getElementById('summary-critical').textContent = summary.critical_count;
            document.getElementById('summary-score').textContent = summary.average_health_score ? Math.round(summary.average_health_score) : '-';
        }

        function updateInstances(instances) {
            const grid = document.getElementById('instance-grid');
            const currentIds = new Set(instances.map(i => i.id));

            // Remove stale instances
            instanceState.forEach(id => {
                if (!currentIds.has(id)) {
                    const el = document.getElementById(`instance-${id}`);
                    if (el) el.remove();
                    instanceState.delete(id);
                }
            });

            instances.forEach(instance => {
                if (!instanceState.has(instance.id)) {
                    // Create new card
                    const card = createInstanceCard(instance);
                    grid.appendChild(card);
                    instanceState.add(instance.id);
                } else {
                    // Update existing card
                    updateInstanceCard(instance);
                }
            });
        }

        function getStatusColor(status) {
            switch(status) {
                case 'Healthy': return 'bg-green-100 text-green-800';
                case 'Warning': return 'bg-yellow-100 text-yellow-800';
                case 'Critical': return 'bg-red-100 text-red-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        function createInstanceCard(instance) {
            const div = document.createElement('div');
            div.id = `instance-${instance.id}`;
            div.className = 'bg-white overflow-hidden shadow rounded-lg border border-gray-200 transition-all duration-300';
            
            div.innerHTML = `
                <div class="px-4 py-5 sm:px-6 border-b border-gray-100 flex justify-between items-center">
                    <div>
                        <h3 class="text-lg leading-6 font-medium text-gray-900">${instance.name}</h3>
                        <p class="mt-1 max-w-2xl text-sm text-gray-500">${instance.connection_string.split('@')[1] || 'localhost'}</p>
                    </div>
                    <span id="status-${instance.id}" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${getStatusColor(instance.status)}">
                        ${instance.status}
                    </span>
                </div>
                <div class="px-4 py-5 sm:p-6">
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <div class="text-sm text-gray-500">Health Score</div>
                            <div class="text-2xl font-bold" id="score-${instance.id}">${instance.health_score || '-'}</div>
                        </div>
                        <div>
                            <div class="text-sm text-gray-500">Active Connections</div>
                            <div class="text-2xl font-bold" id="conns-${instance.id}">${instance.metrics?.active_connections || 0}</div>
                        </div>
                    </div>
                    
                    <!-- Detailed Metrics Pane -->
                    <div class="bg-gray-50 rounded-md p-3 space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-500">Lock Contention</span>
                            <span class="font-medium" id="locks-${instance.id}">${instance.metrics?.locked_connections_count || 0}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Idle Tx</span>
                            <span class="font-medium" id="idle-${instance.id}">${instance.metrics?.idle_in_transaction_count || 0}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">eBPF Lock Wait</span>
                            <span class="font-medium" id="ebpf-${instance.id}">
                                ${instance.metrics?.ebpf_lock_summary ? instance.metrics.ebpf_lock_summary.total_wait_time_ms.toFixed(1) + 'ms' : 'N/A'}
                            </span>
                        </div>
                    </div>
                </div>
            `;
            return div;
        }

        function updateInstanceCard(instance) {
            // Granular DOM updates - no innerHTML replacement
            const statusEl = document.getElementById(`status-${instance.id}`);
            statusEl.className = `px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${getStatusColor(instance.status)}`;
            statusEl.textContent = instance.status;

            document.getElementById(`score-${instance.id}`).textContent = instance.health_score || '-';
            document.getElementById(`conns-${instance.id}`).textContent = instance.metrics?.active_connections || 0;
            document.getElementById(`locks-${instance.id}`).textContent = instance.metrics?.locked_connections_count || 0;
            document.getElementById(`idle-${instance.id}`).textContent = instance.metrics?.idle_in_transaction_count || 0;
            
            const ebpfEl = document.getElementById(`ebpf-${instance.id}`);
            if (instance.metrics?.ebpf_lock_summary) {
                ebpfEl.textContent = instance.metrics.ebpf_lock_summary.total_wait_time_ms.toFixed(1) + 'ms';
                ebpfEl.classList.remove('text-gray-400');
            } else {
                ebpfEl.textContent = 'N/A';
                ebpfEl.classList.add('text-gray-400');
            }
        }

        // Initial fetch
        fetchFleetData();

        // Poll every 5 seconds
        setInterval(fetchFleetData, 5000);
    </script>
</body>
</html>
