name: Benchmark Validation

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'examples/benchmark-pack/**'
      - 'scripts/bench/**'
  workflow_dispatch:  # Allow manual trigger

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  benchmark:
    name: Benchmark Scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bench_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
    
    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev libsqlite3-dev postgresql-client bc
    
    - name: Setup pg_stat_statements
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -p 5433 -U postgres -d bench_test -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
    
    - name: Build Vaanyze
      run: cargo build --release
    
    # Run 2 core scenarios for CI (fast, ~5 min total)
    # Scenario 1: Missing index on WHERE predicate (most common case)
    - name: Run scenario - missing-index-where
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5433/bench_test
        PGPASSWORD: postgres
      run: |
        ./scripts/bench/run_scenario.sh 01-missing-index-where || true
      continue-on-error: true
    
    # Scenario 4: ORDER BY + LIMIT without index (common query pattern)
    - name: Run scenario - order-by-limit
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5433/bench_test
        PGPASSWORD: postgres
      run: |
        ./scripts/bench/run_scenario.sh 04-order-by-limit || true
      continue-on-error: true
    
    # Generate summary
    - name: Summarize results
      run: |
        ./scripts/bench/summarize_results.sh --ci || echo "Some scenarios failed or not run"
      continue-on-error: true
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results-${{ github.sha }}
        path: examples/benchmark-pack/results/
        retention-days: 30
    
    # Comment on PR with results
    - name: Comment PR with results
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request' && always()
      with:
        script: |
          const fs = require('fs');
          let summary = '';
          try {
            summary = fs.readFileSync('examples/benchmark-pack/results/SUMMARY.md', 'utf8');
          } catch (e) {
            summary = '## Benchmark Results\n\nNo results generated. Check workflow logs.';
          }
          
          // Find existing comment
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const botComment = comments.find(c => c.body.includes('Vaanyze Benchmark Results'));
          
          const body = `<!-- vaanyze-bench -->\n${summary}`;
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }

  # Full benchmark suite (manual trigger only)
  benchmark-full:
    name: Full Benchmark Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Start benchmark stack
      run: make bench-up
    
    - name: Wait for Postgres
      run: sleep 10
    
    - name: Build Vaanyze
      run: cargo build --release
    
    - name: Run all scenarios
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5433/bench_test
      run: make bench-all
    
    - name: Generate summary
      run: ./scripts/bench/summarize_results.sh
    
    - name: Cleanup
      if: always()
      run: make bench-down
    
    - name: Upload full results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-full-${{ github.sha }}
        path: examples/benchmark-pack/results/
