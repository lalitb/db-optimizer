name: CNPG Plugin CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/cnpg_plugin/**'
      - 'Dockerfile.cnpg'
      - 'k8s/cnpg-plugin.yaml'
      - 'Cargo.toml'
      - '.github/workflows/cnpg-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/cnpg_plugin/**'
      - 'Dockerfile.cnpg'
      - 'k8s/cnpg-plugin.yaml'
      - 'Cargo.toml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-cnpg:
    name: Build CNPG Plugin
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
        components: rustfmt, clippy
    
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-cnpg-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-cnpg-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-cnpg-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev libsqlite3-dev protobuf-compiler
    
    - name: Check CNPG feature formatting
      run: cargo fmt --all -- --check
    
    - name: Clippy CNPG feature
      run: cargo clippy --features cnpg -- -D warnings
    
    - name: Build CNPG feature
      run: cargo build --verbose --release --features cnpg
    
    - name: Test CNPG feature
      run: cargo test --verbose --features cnpg
    
    - name: Upload plugin binary
      uses: actions/upload-artifact@v4
      with:
        name: cnpg-plugin-${{ github.sha }}
        path: target/release/pg-query-advisor
        retention-days: 7

  docker-build:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: build-cnpg
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.cnpg
        push: false
        tags: vaanyze/cnpg-plugin:test-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true
    
    - name: Test Docker image runs
      run: |
        docker images | grep vaanyze
        docker run --rm vaanyze/cnpg-plugin:test-${{ github.sha }} --version || echo "Binary check skipped (no --version flag yet)"
    
    - name: Inspect Docker image
      run: |
        docker inspect vaanyze/cnpg-plugin:test-${{ github.sha }}
        docker history vaanyze/cnpg-plugin:test-${{ github.sha }}

  kubernetes-manifests:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install kubeval
      run: |
        wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
        tar xf kubeval-linux-amd64.tar.gz
        sudo mv kubeval /usr/local/bin
    
    - name: Validate CNPG plugin manifest
      run: kubeval k8s/cnpg-plugin.yaml
    
    - name: Check for common K8s issues
      run: |
        # Check for missing resource limits
        if ! grep -q "limits:" k8s/cnpg-plugin.yaml; then
          echo "⚠️  Warning: No resource limits defined"
        fi
        
        # Check for security context
        if ! grep -q "securityContext:" k8s/cnpg-plugin.yaml; then
          echo "⚠️  Warning: No security context defined"
        fi
        
        # Check for health probes
        if ! grep -q "livenessProbe:" k8s/cnpg-plugin.yaml; then
          echo "⚠️  Warning: No liveness probe defined"
        fi
        
        echo "✅ Manifest validation complete"

  # Note: Full integration test requires Kind cluster and takes ~10 minutes
  # Disabled by default, enable manually for full E2E testing
  # integration-test:
  #   name: CNPG Integration Test
  #   runs-on: ubuntu-latest
  #   needs: docker-build
  #   if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'integration-test')
  #   
  #   steps:
  #   - uses: actions/checkout@v4
  #   
  #   - name: Install Kind
  #     run: |
  #       curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
  #       chmod +x ./kind
  #       sudo mv ./kind /usr/local/bin/kind
  #   
  #   - name: Install kubectl
  #     run: |
  #       curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
  #       chmod +x kubectl
  #       sudo mv kubectl /usr/local/bin/
  #   
  #   - name: Run integration test
  #     run: |
  #       chmod +x tests/cnpg_integration_test.sh
  #       ./tests/cnpg_integration_test.sh

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build-cnpg, docker-build, kubernetes-manifests]
    if: always()
    
    steps:
    - name: Check status
      run: |
        echo "## CNPG Plugin CI Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Build: ${{ needs.build-cnpg.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Docker: ${{ needs.docker-build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- K8s Manifests: ${{ needs.kubernetes-manifests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.build-cnpg.result }}" == "success" ] && \
           [ "${{ needs.docker-build.result }}" == "success" ] && \
           [ "${{ needs.kubernetes-manifests.result }}" == "success" ]; then
          echo "✅ All checks passed!" >> $GITHUB_STEP_SUMMARY
          exit 0
        else
          echo "❌ Some checks failed" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
