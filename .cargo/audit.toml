# Cargo audit configuration
# See: https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
# Ignore advisories that don't affect our use case
ignore = [
    # rsa vulnerability in sqlx-mysql - we only use PostgreSQL, not MySQL
    # The vulnerable code path is never executed in our application
    "RUSTSEC-2023-0071",
]

# Allow unmaintained crates (treated as warnings, not errors)
[advisories.unmaintained]
warn = true
