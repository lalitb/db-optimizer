[package]
name = "pg-query-advisor"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "PostgreSQL query health advisor - find performance issues and cost savings"

[dependencies]
rand = "0.8"
# Database
sqlx = { version = "0.7", features = ["postgres", "sqlite", "runtime-tokio-native-tls", "chrono"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Terminal output
colored = "2"
tabled = "0.15"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# String utilities
regex = "1"

# System information
num_cpus = "1"

# HTTP client for notifications
reqwest = { version = "0.11", features = ["json"] }

# HTTP server
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
lazy_static = "1.4"

# SQL parsing for query rewriting
sqlparser = "0.39"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
