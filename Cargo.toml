[package]
name = "pg-query-advisor"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "PostgreSQL query health advisor - find performance issues and cost savings"

[dependencies]
rand = "0.8"
# Database - updated to fix RUSTSEC-2024-0363
sqlx = { version = "0.8", features = ["postgres", "sqlite", "runtime-tokio-native-tls", "chrono"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Terminal output
colored = "2"
tabled = "0.15"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# eBPF support (using aya - pure Rust eBPF library)
aya = { version = "0.12", optional = true }
aya-log = { version = "0.2", optional = true }

# Binary serialization for IPC protocol
bincode = "1.3"

# Byte manipulation for safe event parsing
bytemuck = { version = "1.14", features = ["derive"] }
zerocopy = { version = "0.7", features = ["derive"] }

# Prometheus metrics for self-observability - updated to fix RUSTSEC-2024-0437
prometheus = "0.14"

# libc for clock operations
libc = "0.2"

# String utilities
regex = "1"

# System information
num_cpus = "1"

# HTTP client for notifications - updated to fix RUSTSEC-2025-0134
reqwest = { version = "0.12", features = ["json"] }

# HTTP server
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
lazy_static = "1.4"

# SQL parsing for query rewriting
sqlparser = "0.39"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# gRPC support for CNPG plugin
tonic = { version = "0.11", optional = true }
prost = { version = "0.12", optional = true }
tokio-stream = { version = "0.1", optional = true }
kube = { version = "0.96", optional = true, features = ["client", "rustls-tls"] }
k8s-openapi = { version = "0.23", optional = true, features = ["latest"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"

[build-dependencies]
tonic-build = "0.11"

[features]
default = []
ebpf = ["aya", "aya-log"]
cnpg = ["dep:tonic", "dep:prost", "dep:tokio-stream", "dep:kube", "dep:k8s-openapi"]
