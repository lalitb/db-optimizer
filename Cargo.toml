[package]
name = "pg-query-advisor"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "PostgreSQL query health advisor - find performance issues and cost savings"

[features]
# Keep the default build lean and customer-safe.
default = []

# CloudNativePG plugin (unfinished; requires tonic + generated protos).
cnpg = ["dep:tonic", "dep:prost", "dep:tokio-stream", "dep:kube", "dep:k8s-openapi"]

[dependencies]
tonic = { version = "0.10", optional = true }
prost = { version = "0.12", optional = true }
tokio-stream = { version = "0.1", optional = true }
kube = { version = "0.87", features = ["runtime", "derive"], optional = true }
k8s-openapi = { version = "0.20", features = ["v1_27"], optional = true }
rand = "0.8"
# Database
sqlx = { version = "0.7", features = ["postgres", "sqlite", "runtime-tokio-native-tls", "chrono"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Terminal output
colored = "2"
tabled = "0.15"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# eBPF support (optional - only needed if building with eBPF features)
# libbpf-rs = { version = "0.22", optional = true }
# libbpf-sys = { version = "1.2", optional = true }

# String utilities
regex = "1"

[build-dependencies]
tonic-build = "0.10"

# System information
num_cpus = "1"

# HTTP client for notifications
reqwest = { version = "0.11", features = ["json"] }

# HTTP server
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
lazy_static = "1.4"

# SQL parsing for query rewriting
sqlparser = "0.39"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
